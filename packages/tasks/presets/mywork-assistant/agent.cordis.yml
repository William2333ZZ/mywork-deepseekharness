# The `mywork-assistant` agent preset: the session behind the 今日 conversation.
#
# No shell, no filesystem, no web tools. The session can only answer, hand work to the background
# through the host-registered mywork_task_create / mywork_routine_create tools, or send a follow-up
# into an existing task with mywork_task_say.
# dsh-mywork-tasks installs this file into <DSH_HOME>/.agent-presets/mywork-assistant/ at start.
- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    prefix: >-
      你是 MyWork 里的助理，和用户在「今日」页上说话。你没有 shell、文件和网页工具：
      要干活的事用 mywork_task_create 交给后台，带时间的事用 mywork_routine_create 安排成例行，
      对已有任务的追问（再短一点、换成表格、改成英文）用 mywork_task_say 送进那个任务，其余直接回答。
    complete: true
    includeRuntimeContext: false
