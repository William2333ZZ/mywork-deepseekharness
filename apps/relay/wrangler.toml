# MyWork relay: one Durable Object per paired computer, on Cloudflare's free plan (SQLite-backed Durable Objects).
name = "mywork-relay"
main = "src/index.js"
compatibility_date = "2025-09-01"
workers_dev = true

# The web version of the phone app (built by build-web.sh into ./public). Only the relay's own paths run the Worker;
# everything else is a static file (free, and not counted against the Worker's requests).
[assets]
directory = "./public"
run_worker_first = ["/v1/*", "/health"]
not_found_handling = "single-page-application"

[[durable_objects.bindings]]
name = "RELAY"
class_name = "Relay"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Relay"]

# One address may open at most 60 relay connections a minute (phones reconnect with backoff, computers far less).
[[ratelimits]]
name = "CONNECT_LIMIT"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 60
  period = 60
